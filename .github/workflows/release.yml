name: Publish Release

on:
  push:
    branches: [main]
    paths:
      - build.gradle
      - src/**
      - presets/**
      - CHANGELOG.md
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Read project version
        id: version
        shell: bash
        run: |
          version="$(./gradlew properties -q | sed -n 's/^version: //p' | head -n 1)"
          test -n "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Verify changelog entry
        shell: bash
        run: grep -F "## [${{ steps.version.outputs.value }}]" CHANGELOG.md

      - name: Build release JAR
        run: ./gradlew clean build --no-daemon

      - name: Prepare release assets and notes
        shell: bash
        run: |
          version="${{ steps.version.outputs.value }}"
          mkdir -p release
          cp "build/libs/WRTPKILL-${version}.jar" "release/WRTPKILL-${version}.jar"
          cp "build/libs/WRTPKILL-${version}.jar" "release/WRTPKILL.jar"
          cp src/main/resources/config.yml release/config-zh_CN.yml
          cp presets/config-en_US.yml release/config-en_US.yml
          (
            cd release
            sha256sum WRTPKILL.jar "WRTPKILL-${version}.jar" config-zh_CN.yml config-en_US.yml > SHA256SUMS.txt
          )
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${{ steps.version.outputs.value }}"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "WRTPKILL ${tag}" --notes-file release-notes.md --latest
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "WRTPKILL ${tag}" --notes-file release-notes.md --latest
          fi
          gh release upload "$tag" \
            release/WRTPKILL.jar \
            "release/WRTPKILL-${version}.jar" \
            release/config-zh_CN.yml \
            release/config-en_US.yml \
            release/SHA256SUMS.txt \
            --clobber
