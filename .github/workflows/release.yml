name: Publish Release

on:
  push:
    branches: [main]
    paths:
      - build.gradle
      - src/**
      - presets/**
      - CHANGELOG.md
      - RELEASE_NOTICE.md
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read project version
        id: version
        shell: bash
        run: |
          version="$(./gradlew properties -q | sed -n 's/^version: //p' | head -n 1)"
          test -n "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Verify changelog entry
        shell: bash
        run: grep -F "## [${{ steps.version.outputs.value }}]" CHANGELOG.md

      - name: Build language JARs
        run: ./gradlew clean build --no-daemon

      - name: Verify immutable release assets and notes
        shell: bash
        run: |
          version="${{ steps.version.outputs.value }}"
          test -s "build/libs/WRTPKILL-${version}-en.us.jar"
          test -s "build/libs/WRTPKILL-${version}-zh.cn.jar"
          test -s build/release/release-notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${{ steps.version.outputs.value }}"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "WRTPKILL ${tag}" --notes-file build/release/release-notes.md --latest
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "WRTPKILL ${tag}" --notes-file build/release/release-notes.md --latest
          fi
          while IFS= read -r asset; do
            gh release delete-asset "$tag" "$asset" --yes
          done < <(gh release view "$tag" --json assets --jq '.assets[].name')
          gh release upload "$tag" \
            "build/libs/WRTPKILL-${version}-en.us.jar" \
            "build/libs/WRTPKILL-${version}-zh.cn.jar" \
            --clobber
