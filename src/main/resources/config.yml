# ============================================================== #
#                                                                #
#                W R T P K I L L   整 合 插 件             #
#                                                                #
#    作者: Lazyz                                                 #
#    描述: 高度优化的多世界 RTP、TPA 互通与基础生存(自杀/复活接管)整合核心    #
#                                                                #
# ============================================================== #

# Kitloader-style schema marker. It is advanced automatically during updates;
# functional settings below remain owned by the server administrator.
# A changed config.yml is backed up under config-backups/ before replacement.
config-version: 1

# ========================================== #
#               全 局 设 置              #
# ========================================== #
# 插件更新后无需删除本文件。新版配置项与注释会自动合并，现有参数、自定义世界和主动删除项会保留。
# .wrtpkill-default-config.yml 是自动维护的官方默认值基线，不包含任何服务器私人参数。

# 界面语言。可选值: zh_CN / en_US
# 修改后使用 /wrtp reload，或重启服务器使其生效。
language: "zh_CN"

# 自动更新器会在服务器启动时检查 GitHub Releases。
# 发现新版本时默认下载到服务器 update 目录，并在下次重启时由服务端替换。
updater:
  enabled: true
  auto-download: true

# 白名单免责名单 (玩家ID)
# 在此列表中的玩家会绕过 TPA/RTP 的传送锁定检查，可无限制传送。
# 服务器 OP 也可使用 /wrtp whitelist add <玩家名称> 添加玩家。
whitelist: []

# 玩家互传系统全局开关
# 若设为 false，所有玩家将无法使用 /tpa 相关指令。
tpa-enabled: true


# ========================================== #
#           生 存 与 复 活 接 管 设 置         #
# ========================================== #
suicide-settings:
  # 是否接管服务器的原版死亡复活机制？
  # 开启后，玩家死亡将不会看到原版的“你死了”界面，而是瞬间满血并传送到下方设置的复活点。
  force-respawn-enabled: true

  # 默认的复活世界名称（若下方 custom-spawn 开启，则以 custom-spawn 为准）
  respawn-world: "world"

  # 是否开启离线惩罚/清理功能？
  offline-clear-enabled: true

  # 离线惩罚阈值（单位：分钟）
  # 玩家离线超过此时间后，再次上线会被清空背包、末影箱，并强制拉回复活点。
  # 提示：该惩罚触发后，会自动解除玩家身上的 RTP/TPA 传送锁定。
  offline-clear-minutes: 3

  # 首次进服强制传送
  # 新玩家第一次加入服务器时，是否强制将其传送到复活点。
  first-join-teleport-enabled: true


# ========================================== #
#           全 服 统 一 复 活 点 坐 标         #
# ========================================== #
# 提示：强烈建议直接在游戏内站在目标位置，使用管理员指令 /wrtp setspawn 设置，
# 插件将自动精准覆盖此处的坐标，无需手动填写！
custom-spawn:
  enabled: false
  x: 0.5
  y: 64.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0


# ========================================== #
#             动 态 多 世 界 RTP 设 置         #
# ========================================== #
# 在此配置你的多世界随机传送节点。
# 键名 (如 world_nether) 即为玩家可以在游戏内直接输入的指令，如 /world_nether。
# 提示：你可以使用管理员指令 /wrtp add <指令> <世界> 在游戏内快捷添加。
worlds:
  nether:
    # 目标世界名称
    world-name: "world_nether"
    # 是否使用当前世界的原版边界 (WorldBorder) 作为随机传送范围？
    # 若设为 true，下方的 min-x, max-x, min-z, max-z 将失效并被自动忽略。
    use-border: false
    # 手动指定的安全随机传送范围 (仅在 use-border 为 false 时生效)
    min-x: -200
    max-x: 200
    min-z: -200
    max-z: 200
    # 扫描安全落脚点的 Y 轴范围限制 (下界推荐 0~120 避开顶部基岩)
    scan-max-y: 18
    scan-min-y: 0

  overworld:
    world-name: "world"
    use-border: false
    min-x: -200
    max-x: 200
    min-z: -200
    max-z: 200
    # 扫描安全落脚点的 Y 轴范围限制 (主世界推荐 -64~319)
    scan-max-y: 319
    scan-min-y: -64

# ========================================== #
