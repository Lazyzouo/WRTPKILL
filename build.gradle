plugins {
    id 'java'
}

def pluginGroup = "com.lazyz.wrtpkill"
def pluginName = "WRTPKILL"
def pluginAuthor = "Lazyz"

group = pluginGroup
version = '1.2.2'

def releaseNotesVersion = providers.gradleProperty('releaseVersion').getOrElse(version.toString())
def releaseNoticeFile = layout.projectDirectory.file('RELEASE_NOTICE.md')
def changelogFile = layout.projectDirectory.file('CHANGELOG.md')
def generatedReleaseNotesFile = layout.buildDirectory.file('release/release-notes.md')

repositories {
    mavenCentral()
    maven { url 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testImplementation 'org.yaml:snakeyaml:2.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.4'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

test {
    useJUnitPlatform()
}

tasks.register('generateReleaseNotes') {
    inputs.file(releaseNoticeFile)
    inputs.file(changelogFile)
    inputs.property('releaseVersion', releaseNotesVersion)
    outputs.file(generatedReleaseNotesFile)

    doLast {
        def changelog = changelogFile.asFile.getText('UTF-8').replace('\r\n', '\n')
        def marker = "## [${releaseNotesVersion}]"
        def markerIndex = changelog.indexOf(marker)
        if (markerIndex < 0) {
            throw new GradleException("Missing CHANGELOG.md entry for ${releaseNotesVersion}")
        }

        def contentStart = changelog.indexOf('\n', markerIndex)
        def nextEntry = changelog.indexOf('\n## [', contentStart)
        def changes = nextEntry < 0
                ? changelog.substring(contentStart)
                : changelog.substring(contentStart, nextEntry)
        def notice = releaseNoticeFile.asFile.getText('UTF-8')
                .replace('{{VERSION}}', releaseNotesVersion)
                .trim()
        def notes = "${notice}\n\n---\n\n## Release Notes / 更新内容\n\n${changes.trim()}\n"

        def target = generatedReleaseNotesFile.get().asFile
        target.parentFile.mkdirs()
        target.setText(notes, 'UTF-8')
    }
}

check.dependsOn generateReleaseNotes

processResources {
    def props = [
            "group"  : project.group,
            "name"   : pluginName,
            "version": project.version,
            "author" : pluginAuthor
    ]
    inputs.properties(props)
    filteringCharset = 'UTF-8'

    filesMatching('plugin.yml') {
        expand(props)
    }
}

tasks.register('chineseJar', Jar) {
    dependsOn classes
    archiveFileName = "${pluginName}-${project.version}-zh.cn.jar"
    from sourceSets.main.output
}

def englishConfigFile = layout.buildDirectory.file('generated/english/config.yml')

tasks.register('prepareEnglishConfig') {
    inputs.file('src/main/resources/config.yml')
    outputs.file(englishConfigFile)

    doLast {
        def chineseDefault = 'language: "zh_CN"'
        def englishDefault = 'language: "en_US"'
        def sourceConfig = file('src/main/resources/config.yml').getText('UTF-8')
        if (sourceConfig.count(chineseDefault) != 1) {
            throw new GradleException("Expected exactly one official language setting in config.yml")
        }

        def targetConfig = englishConfigFile.get().asFile
        targetConfig.parentFile.mkdirs()
        targetConfig.setText(sourceConfig.replace(chineseDefault, englishDefault), 'UTF-8')
    }
}

tasks.register('englishJar', Jar) {
    dependsOn classes, prepareEnglishConfig
    archiveFileName = "${pluginName}-${project.version}-en.us.jar"
    from(sourceSets.main.output) {
        exclude 'config.yml'
    }
    from(englishConfigFile) {
        into ''
    }
}

assemble.dependsOn chineseJar, englishJar
